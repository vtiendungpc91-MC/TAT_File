<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>Sổ Thu Chi</title>
  <meta name="description" content="Quản lý thu chi cá nhân, chạy offline">
  <meta name="theme-color" id="theme-color" content="#1f6feb">
  <script>
    // Áp chế độ sáng/tối trước khi vẽ để không bị nháy màn hình.
    try {
      var t = localStorage.getItem('stc-theme');
      if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
        document.getElementById('theme-color').content = '#0d1117';
      }
    } catch (e) {}
  </script>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Thu Chi">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app">
    <main id="main" class="main"></main>
    <nav class="tabbar" id="tabbar">
      <a href="#/tx" data-tab="tx"><span class="ti">📒</span><span>Giao dịch</span></a>
      <a href="#/reports" data-tab="reports"><span class="ti">📊</span><span>Báo cáo</span></a>
      <a href="#/plan" data-tab="plan"><span class="ti">🎯</span><span>Kế hoạch</span></a>
      <a href="#/bookset" data-tab="bookset"><span class="ti">⚙️</span><span>Cài đặt</span></a>
    </nav>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <noscript>Ứng dụng cần bật JavaScript.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
